services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hackathon_validator
      POSTGRES_USER: validator
      POSTGRES_PASSWORD: validator
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U validator -d hackathon_validator"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build:
      context: ./frontend
      args: {VITE_API_URL: http://localhost:8000/api}
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  postgres_data:
